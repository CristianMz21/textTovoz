[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "texttovoz"
version = "0.1.0"
description = "Notebook-first Spanish text-to-voice pipeline helpers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pydantic>=2",
  "pyyaml",
  "soundfile",
]

[project.optional-dependencies]
test = [
  "pytest",
  "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
texttovoz = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
